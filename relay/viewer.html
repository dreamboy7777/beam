<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beam Relay — watch</title>
  <link rel="stylesheet" href="/relay/relay.css" />
  <style>
    .viewer { width: min(1280px, 100%); margin: 0 auto; padding: 18px; }
    .viewer .stage { aspect-ratio: 16 / 9; }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(4, 5, 9, 0.45);
      backdrop-filter: blur(2px);
      z-index: 3;
    }
    .overlay.hidden { display: none; }
    .overlay button { padding: 16px 24px; font-size: 15px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .title { font-weight: 800; letter-spacing: -.03em; }
    .title span { color: var(--muted); font-weight: 500; font-size: 12px; }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="topbar">
      <div class="title">Beam Relay <span>watching</span></div>
      <div class="pill"><span class="dot" id="netDot"></span><span id="netText">Connecting…</span></div>
    </div>

    <div class="stage">
      <video id="video" autoplay playsinline></video>
      <div class="overlay" id="overlay">
        <button id="watchBtn">Watch with sound</button>
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <span class="badge" id="statusBadge">Waiting for host…</span>
      <button id="muteBtn" class="ghost">Mute</button>
      <button id="reloadBtn" class="ghost">Reconnect</button>
    </div>
    <p class="micro" id="hint">The host must share Entire screen with Share system audio. If you hear nothing, click Watch with sound and check your volume.</p>
  </div>
  <script src="/relay/viewer.js"></script>
</body>
</html>
